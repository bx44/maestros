<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Or Barak — Maestros</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#29235C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Or Barak">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#29235C; --navy-d:#1D1940; --navy-soft:#9A94C0; --navy-line:#C6C2DC;
    --gold:#C99B52; --gold-d:#8E6A2E; --gold-bg:#F9F2E4;
    --paper:#F3F2F8; --ink:#212322; --ink-2:#3E4140; --muted:#656263; --muted-2:#747779;
    --line:#D5D6D7; --line-2:#EBECEC; --bad:#8C3A32; --gris:#F6F6F5;
    --core:'Mulish',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --cond:'Barlow Condensed',var(--core);
    --tech:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sombra:0 1px 2px rgba(33,35,34,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{background:var(--paper); color:var(--ink); font:400 16px/1.5 var(--core); padding-bottom:120px}
  h1,h2,h3{margin:0}
  #app-shell{max-width:430px; margin:0 auto; background:#fff; min-height:100vh;
             border-left:1px solid var(--line); border-right:1px solid var(--line)}
  .wrap{padding:0 20px}

  /* etiquetas y microtipografía */
  label,.etq{display:block; font:700 12px/1.2 var(--cond); letter-spacing:.12em;
             text-transform:uppercase; color:var(--muted); margin:0 0 7px}
  .etq-mini{font:700 10px/1.2 var(--cond); letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2)}
  .muted{font:400 12px/1.5 var(--tech); color:var(--muted-2)}
  .toca{font:700 11px/1.4 var(--cond); letter-spacing:.14em; text-transform:uppercase; color:var(--gold-d)}

  /* controles */
  select,input,textarea{
    width:100%; font:400 16px/1.5 var(--core); color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:2px; padding:12px;
  }
  textarea{min-height:76px; resize:vertical}
  select:focus,input:focus,textarea:focus,button:focus-visible{
    outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(201,155,82,.45)}
  .campo{margin-bottom:16px}
  .campo:last-child{margin-bottom:0}
  #inp-pin{font:400 20px/1.4 var(--tech); letter-spacing:.3em}

  /* encabezados */
  .hero{background:var(--navy); padding:calc(46px + env(safe-area-inset-top)) 24px 40px;
        display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center}
  .hero img{width:56px; display:block}
  .hero .eyebrow{font:600 12px/1 var(--cond); letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}
  .hero .titulo{font:300 30px/1.15 var(--core); color:#fff; letter-spacing:.02em; margin-top:10px}

  header{background:var(--navy); padding:calc(16px + env(safe-area-inset-top)) 20px 0}
  .marca{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .marca .izq{display:flex; align-items:center; gap:10px}
  .marca img{width:26px; display:block}
  .marca .nombre{font:700 15px/1 var(--cond); letter-spacing:.16em; text-transform:uppercase; color:#fff}
  #btn-salir{display:flex; align-items:center; min-height:44px; padding:0 4px; text-decoration:none;
             font:700 11px/1 var(--cond); letter-spacing:.14em; text-transform:uppercase; color:var(--navy-line)}
  #hdr-materia{font:600 20px/1.25 var(--core); color:#fff; margin-top:16px}
  #hdr-maestro{display:block; font:400 13px/1.5 var(--tech); color:var(--navy-soft); margin-top:2px}
  nav{display:flex; margin-top:14px}
  nav button{
    flex:1; background:transparent; border:0; border-bottom:2px solid transparent; cursor:pointer;
    font:700 12px/1 var(--cond); letter-spacing:.12em; text-transform:uppercase;
    color:var(--navy-soft); padding:14px 4px;
  }
  nav button.on{color:#fff; border-bottom-color:var(--gold)}

  main{padding:18px 20px 20px; display:flex; flex-direction:column; gap:18px}

  /* tarjetas */
  .card{background:#fff; border:1px solid var(--line); border-radius:4px; padding:16px;
        box-shadow:var(--sombra); margin:0}
  .card h3{font:600 16px/1.2 var(--core); color:var(--ink)}

  /* plan de la sesión */
  .plan{background:#fff; border:1px solid var(--line); border-top:3px solid var(--gold);
        border-radius:4px; padding:16px; box-shadow:var(--sombra); display:flex; gap:14px; margin:0}
  .plan .n{flex:0 0 auto; text-align:center; min-width:46px}
  .plan .n b{display:block; font:300 34px/1 var(--core); color:var(--navy); font-variant-numeric:tabular-nums}
  .plan .n span{display:block; margin-top:4px; font:700 10px/1.2 var(--cond);
                letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2)}
  .plan .t{font:600 17px/1.3 var(--core); color:var(--ink); margin-bottom:4px; text-wrap:pretty}
  .plan dl{margin:10px 0 0}
  .plan dt{font:700 10px/1.2 var(--cond); letter-spacing:.14em; text-transform:uppercase;
           color:var(--muted-2); margin-top:10px}
  .plan dd{margin:2px 0 0; font-size:14px; line-height:1.5; color:var(--ink-2)}
  .sinplan{border-top-color:var(--gold-d); background:var(--gold-bg); display:block}

  /* segmentos */
  .seg{display:flex; gap:8px}
  .seg button{
    flex:1; min-height:44px; padding:12px 4px; cursor:pointer; background:#fff;
    border:1px solid var(--line); border-radius:2px; color:var(--muted);
    font:700 12px/1 var(--cond); letter-spacing:.12em; text-transform:uppercase;
  }
  .seg button.on{background:var(--navy); border-color:var(--navy); color:#fff}
  .seg.si button.on[data-v="Sí"]{background:var(--navy); border-color:var(--navy)}
  .seg.si button.on[data-v="Parcial"]{background:var(--gold-d); border-color:var(--gold-d)}
  .seg.si button.on[data-v="No"]{background:var(--bad); border-color:var(--bad)}

  /* asistencia */
  .cuenta{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px}
  .cuenta b{font:400 12px/1.4 var(--tech); color:var(--muted-2); font-weight:400}
  .cuenta button{min-height:44px; padding:12px 14px; background:#fff; border:1px solid var(--navy);
                 border-radius:2px; color:var(--navy); cursor:pointer;
                 font:700 11px/1 var(--cond); letter-spacing:.12em; text-transform:uppercase}
  .alumno{padding:12px 0; border-top:1px solid var(--line-2)}
  .alumno:first-child{border-top:0}
  .alumno .nm{font:600 15px/1.3 var(--core); color:var(--ink); margin-bottom:8px}
  .mini{display:flex; gap:6px}
  .mini button{
    flex:1; min-height:40px; padding:10px 2px; cursor:pointer; background:#fff;
    border:1px solid var(--line); border-radius:2px; color:var(--muted);
    font:700 11px/1 var(--cond); letter-spacing:.08em; text-transform:uppercase;
  }
  .mini button.on[data-v="Asistió"]{background:var(--navy); border-color:var(--navy); color:#fff}
  .mini button.on[data-v="Retardo"]{background:var(--gold); border-color:var(--gold); color:#fff}
  .mini button.on[data-v="Falta"]{background:var(--bad); border-color:var(--bad); color:#fff}
  .mini button.on[data-v="Falta justificada"]{background:var(--muted-2); border-color:var(--muted-2); color:#fff}
  .calif{width:88px; text-align:center; font:400 16px/1.4 var(--tech)}

  /* progreso */
  .barraprog{height:4px; background:var(--line-2); overflow:hidden; margin-top:12px}
  .barraprog i{display:block; height:100%; background:var(--gold); transition:width .3s ease}

  /* barra inferior */
  .barra{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none}
  .barra > div{width:100%; max-width:430px; background:rgba(255,255,255,.97); pointer-events:auto;
               border-top:1px solid var(--line); padding:12px 20px calc(16px + env(safe-area-inset-bottom));
               display:flex; flex-direction:column; gap:8px}
  .barra .resumen{display:flex; align-items:center; justify-content:space-between; gap:12px;
                  font:400 12px/1.4 var(--tech); color:var(--muted-2)}
  .barra .resumen span:last-child{color:var(--gold-d)}
  .cta{width:100%; min-height:48px; padding:15px; border:0; border-radius:2px; cursor:pointer;
       background:var(--navy); color:#fff;
       font:700 13px/1 var(--cond); letter-spacing:.14em; text-transform:uppercase;
       transition:background 140ms cubic-bezier(.4,0,.2,1)}
  .cta:active{opacity:.88}
  .cta[disabled]{background:#8B87A8; cursor:default}
  .cta.linea{background:#fff; border:1px solid var(--navy); color:var(--navy)}

  /* avisos */
  .aviso{background:var(--gris); border-top:3px solid var(--muted-2); padding:12px 14px;
         font-size:14px; line-height:1.5; color:var(--ink-2)}
  .aviso.err{border-top-color:var(--bad)}
  .aviso.info{border-top-color:var(--gold-d)}
  .aviso.ok{border-top-color:var(--navy)}

  /* temario */
  .lista-t{list-style:none; margin:0; padding:0}
  .lista-t li{display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-top:1px solid var(--line-2)}
  .lista-t li:first-child{border-top:0}
  .lista-t .est{flex:0 0 auto; padding:4px 8px; border-radius:2px;
                font:700 10px/1.2 var(--cond); letter-spacing:.12em; text-transform:uppercase}
  .est.dada{background:var(--navy); color:#fff}
  .est.pend{background:var(--gris); color:var(--muted-2); border:1px solid var(--line)}
  .lista-t .tt{font:600 15px/1.35 var(--core); color:var(--ink); text-wrap:pretty}
  .vacio{text-align:center; color:var(--muted-2); font-size:14px; line-height:1.6; padding:26px 10px}

  /* éxito */
  .exito{border-top:3px solid var(--gold); text-align:center; padding:36px 22px}
  .exito img{width:48px; display:block; margin:0 auto 14px}
  .exito h2{font:600 22px/1.25 var(--core); color:var(--navy); margin-bottom:10px}
  .exito p{margin:0 auto 20px; font-size:15px; line-height:1.65; color:var(--ink-2); max-width:34ch}

  #sin-red{display:none; background:var(--gold-d); color:#fff; text-align:center; padding:9px 14px;
           font:600 11px/1.3 var(--cond); letter-spacing:.12em; text-transform:uppercase}
  #sin-red.on{display:block}
  .pila{display:flex; flex-direction:column; gap:18px}
  .oculto{display:none}
</style>
</head>
<body>
<div id="app-shell">
<div id="sin-red">Sin conexión · los registros se envían al volver la señal</div>

<!-- ENTRAR -->
<div id="pantalla-entrar">
  <div class="hero">
    <img src="shield-white.png" alt="Or Barak">
    <div>
      <div class="eyebrow">Metivta Or Barak</div>
      <div class="titulo">Registro de clase</div>
    </div>
  </div>
  <main>
    <div>
      <div class="campo">
        <label for="sel-maestro">Maestro</label>
        <select id="sel-maestro"><option value="">Cargando…</option></select>
      </div>
      <div class="campo">
        <label for="inp-pin">PIN</label>
        <input id="inp-pin" type="tel" inputmode="numeric" maxlength="6" placeholder="Su PIN">
      </div>
      <div id="aviso-entrar" style="margin-bottom:16px"></div>
      <button class="cta" id="btn-entrar">Entrar</button>
    </div>
    <p class="muted" style="text-align:center; margin:0">Si no tiene PIN, pídalo al coordinador.</p>
  </main>
</div>

<!-- APP -->
<div id="pantalla-app" class="oculto">
  <header>
    <div class="marca">
      <div class="izq"><img src="shield-white.png" alt=""><span class="nombre">Or Barak</span></div>
      <a href="#" id="btn-salir">Salir</a>
    </div>
    <h1 id="hdr-materia">Registro de clase</h1>
    <span id="hdr-maestro"></span>
    <nav>
      <button data-tab="clase" class="on">Clase</button>
      <button data-tab="calif">Calificaciones</button>
      <button data-tab="temario">Temario</button>
    </nav>
  </header>

  <main>
    <div class="card" id="card-materia">
      <label for="sel-materia">Materia</label>
      <select id="sel-materia"></select>
      <div class="muted" id="linea-horario" style="margin-top:10px"></div>
      <div id="prog-caja" class="oculto">
        <div class="barraprog"><i id="prog-barra" style="width:0%"></i></div>
        <div class="muted" id="prog-texto" style="margin-top:7px"></div>
      </div>
    </div>

    <!-- CLASE -->
    <section id="tab-clase" class="pila">
      <div class="card" style="padding-bottom:12px">
        <label for="sel-sesion">Sesión</label>
        <select id="sel-sesion"></select>
      </div>
      <div id="plan-caja"></div>
      <div class="card">
        <div class="campo">
          <span class="etq">¿Dio el tema planeado?</span>
          <div class="seg si" id="seg-cubrio">
            <button data-v="Sí">Sí</button><button data-v="Parcial">Parcial</button><button data-v="No">No</button>
          </div>
        </div>
        <div class="campo">
          <label for="inp-impartido">Tema que sí dio</label>
          <textarea id="inp-impartido" placeholder="Lo que se vio en clase"></textarea>
        </div>
        <div class="campo">
          <label for="inp-tarea">Tarea que dejó</label>
          <textarea id="inp-tarea" placeholder="Opcional"></textarea>
        </div>
        <div class="campo">
          <label for="inp-obs">Observaciones</label>
          <textarea id="inp-obs" placeholder="Incidencias, ausencias avisadas, material que faltó"></textarea>
        </div>
      </div>
      <div class="card">
        <div class="cuenta">
          <div><h3>Asistencia</h3><b id="cont-asis">—</b></div>
          <button id="btn-todos">Todos presentes</button>
        </div>
        <div id="lista-alumnos"></div>
      </div>
      <div id="aviso-clase"></div>
    </section>

    <section id="exito" class="oculto">
      <div class="card exito">
        <img src="shield-color.png" alt="">
        <h2 id="exito-titulo">Sesión registrada</h2>
        <p id="exito-msg"></p>
        <button class="cta linea" id="btn-otra">Registrar otra clase</button>
      </div>
    </section>

    <!-- CALIFICACIONES -->
    <section id="tab-calif" class="oculto pila">
      <div class="card">
        <label for="sel-tipo">Tipo de evaluación</label>
        <select id="sel-tipo">
          <option>Examen parcial</option><option>Examen oficial</option>
          <option>Trabajo / proyecto</option><option>Tarea</option>
          <option>Participación</option><option>Diagnóstico</option>
        </select>
      </div>
      <div class="card">
        <h3>Calificaciones</h3>
        <p class="muted" style="margin:2px 0 12px">Escala 0 a 10. Deje en blanco a quien no presentó.</p>
        <div id="lista-calif"></div>
      </div>
      <div id="aviso-calif"></div>
    </section>

    <!-- TEMARIO -->
    <section id="tab-temario" class="oculto">
      <div class="card"><div id="lista-temario"></div></div>
    </section>
  </main>

  <div class="barra"><div>
    <div class="resumen"><span id="barra-resumen"></span><span id="barra-extra"></span></div>
    <button class="cta" id="btn-guardar">Registrar sesión</button>
  </div></div>
</div>
</div>

<script>
var S = { maestro:'', materias:[], clave:'', datos:null, cubrio:'Sí', tab:'clase', asis:{}, enviando:false, forzar:false, sugerida:'', token:'' };

function $(id){ return document.getElementById(id); }
// ================= CONEXIÓN CON EL SHEET =================
// Pega aquí el URL de tu implementación de Apps Script (termina en /exec)
var API_URL = 'https://script.google.com/macros/s/PEGA-AQUI-TU-URL/exec';

// Debe ser IDÉNTICA a la APP_KEY del Apps Script.
var APP_KEY = 'CAMBIA-ESTA-CLAVE-POR-UNA-TUYA';

var OFFLINE = ['registrarSesion', 'registrarCalificaciones'];

function api(fn, args){
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ key: APP_KEY, fn: fn, args: args })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(!d.ok) throw new Error(d.error || 'Error del servidor');
    return d.res;
  });
}

function leerCola(){
  try { return JSON.parse(window.localStorage.getItem('ob_cola') || '[]'); } catch(e){ return []; }
}
function guardarCola(c){
  try { window.localStorage.setItem('ob_cola', JSON.stringify(c)); } catch(e){}
  pintarRed();
}
function encolar(fn, args){
  var c = leerCola(); c.push({ fn: fn, args: args }); guardarCola(c);
}

function sincronizar(){
  var c = leerCola();
  if(!c.length || !navigator.onLine) return;
  var item = c[0];
  api(item.fn, item.args).then(function(){
    var d = leerCola(); d.shift(); guardarCola(d);
    sincronizar();
  }).catch(function(){});
}

function pintarRed(){
  var c = leerCola();
  var caja = $('sin-red');
  if(!navigator.onLine){
    caja.className = 'on';
    caja.textContent = c.length
      ? 'Sin conexión — ' + c.length + ' registro(s) esperando para mandarse'
      : 'Sin conexión — lo que registres se guarda y se manda al volver la señal';
  } else if(c.length){
    caja.className = 'on';
    caja.textContent = 'Mandando ' + c.length + ' registro(s) pendiente(s)…';
  } else {
    caja.className = '';
  }
}

window.addEventListener('online', function(){ pintarRed(); sincronizar(); });
window.addEventListener('offline', pintarRed);

// Puente: deja funcionando el código que ya llamaba a google.script.run
var google = { script: { run: (function crear(ok, err){
  var o = {};
  o.withSuccessHandler = function(f){ return crear(f, err); };
  o.withFailureHandler = function(f){ return crear(ok, f); };
  ['listaMaestros','entrar','reanudar','cerrarSesion','datosMateria','registrarSesion','registrarCalificaciones'].forEach(function(fn){
    o[fn] = function(){
      var args = Array.prototype.slice.call(arguments);
      api(fn, args).then(function(r){ if(ok) ok(r); }).catch(function(e){
        if(OFFLINE.indexOf(fn) >= 0 && !navigator.onLine){
          encolar(fn, args);
          if(ok) ok({ ok:true, mensaje:'Guardado en tu celular. Se manda solo cuando vuelva la señal.' });
          return;
        }
        if(err) err(e);
      });
    };
  });
  return o;
})(null, null) } };

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

function esc(t){ var d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
function aviso(caja, tipo, msg){ $(caja).innerHTML = msg ? '<div class="aviso '+tipo+'">'+esc(msg)+'</div>' : ''; }

// ---------- Entrar ----------
google.script.run.withSuccessHandler(function(lista){
  var s = $('sel-maestro');
  s.innerHTML = '<option value="">Elige tu nombre</option>';
  lista.forEach(function(n){ s.innerHTML += '<option>'+esc(n)+'</option>'; });
  try {
    var guardado = window.localStorage.getItem('ob_maestro');
    if(guardado && lista.indexOf(guardado) >= 0){ s.value = guardado; if(!S.maestro) $('inp-pin').focus(); }
  } catch(e){}
}).withFailureHandler(function(e){ aviso('aviso-entrar','err', e.message); }).listaMaestros();

function guardarSesion(m, t){
  try { window.localStorage.setItem('ob_maestro', m); window.localStorage.setItem('ob_token', t); } catch(e){}
}
function olvidarSesion(){
  try { window.localStorage.removeItem('ob_token'); } catch(e){}
}

function abrirApp(r){
  S.maestro = r.maestro; S.token = r.token; S.materias = r.materias;
  guardarSesion(r.maestro, r.token);
  $('pantalla-entrar').classList.add('oculto');
  $('pantalla-app').classList.remove('oculto');
  $('hdr-maestro').textContent = r.maestro;
  var sm = $('sel-materia');
  if(!r.materias.length){
    sm.innerHTML = '<option value="">No tienes materias asignadas</option>';
    return;
  }
  sm.innerHTML = '';
  r.materias.forEach(function(x){ sm.innerHTML += '<option value="'+esc(x.clave)+'">'+esc(x.materia)+'</option>'; });
  var abrir = r.sugerida || r.materias[0].clave;
  sm.value = abrir;
  S.sugerida = r.sugerida || '';
  cargarMateria(abrir);
}

function terminaEntrada(){
  $('btn-entrar').disabled = false; $('btn-entrar').textContent = 'Entrar';
}

function intentarEntrar(m, p){
  $('btn-entrar').disabled = true; $('btn-entrar').textContent = 'Entrando…';
  google.script.run.withSuccessHandler(function(r){
    terminaEntrada(); abrirApp(r);
  }).withFailureHandler(function(e){
    terminaEntrada(); aviso('aviso-entrar','err', e.message);
  }).entrar(m, p);
}

/** Reanuda con el token guardado; si ya no sirve, pide PIN otra vez. */
function reanudarSesion(token){
  $('btn-entrar').disabled = true; $('btn-entrar').textContent = 'Entrando…';
  google.script.run.withSuccessHandler(function(r){
    terminaEntrada(); abrirApp(r);
  }).withFailureHandler(function(e){
    terminaEntrada(); olvidarSesion(); $('inp-pin').value = '';
    aviso('aviso-entrar','info', e.message);
  }).reanudar(token);
}

$('btn-entrar').onclick = function(){
  var m = $('sel-maestro').value, p = $('inp-pin').value.trim();
  if(!m){ return aviso('aviso-entrar','err','Elige tu nombre de la lista.'); }
  if(!p){ return aviso('aviso-entrar','err','Escribe tu PIN.'); }
  intentarEntrar(m, p);
};

$('btn-salir').onclick = function(e){
  e.preventDefault();
  if(S.token) google.script.run.cerrarSesion(S.token);
  olvidarSesion();
  S.maestro = ''; S.token = ''; S.datos = null;
  $('inp-pin').value = '';
  $('pantalla-app').classList.add('oculto');
  $('pantalla-entrar').classList.remove('oculto');
  aviso('aviso-entrar','','');
  window.scrollTo(0,0);
};

pintarRed(); sincronizar();

// Entrada automática si ya entró antes en este celular
(function(){
  var t = null;
  try { t = window.localStorage.getItem('ob_token'); } catch(e){}
  if(t) reanudarSesion(t);
})();

// ---------- Navegación ----------
Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    S.tab = b.dataset.tab;
    $('exito').classList.add('oculto');
    $('card-materia').classList.remove('oculto');
    ['clase','calif','temario'].forEach(function(t){ $('tab-'+t).classList.toggle('oculto', t!==S.tab); });
    $('btn-guardar').textContent = S.tab==='calif' ? 'Guardar calificaciones' : 'Registrar sesión';
    document.querySelector('.barra').classList.toggle('oculto', S.tab==='temario');
    pintarBarra();
    window.scrollTo(0,0);
  };
});

$('sel-materia').onchange = function(){ cargarMateria(this.value); };

$('btn-todos').onclick = function(){
  for(var id in S.asis) S.asis[id] = 'Asistió';
  Array.prototype.forEach.call($('lista-alumnos').querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.dataset.v === 'Asistió');
  });
  contarAsis();
};

$('btn-otra').onclick = function(){
  $('exito').classList.add('oculto');
  $('tab-clase').classList.remove('oculto');
  $('card-materia').classList.remove('oculto');
  document.querySelector('.barra').classList.remove('oculto');
  cargarMateria(S.clave);
  window.scrollTo(0,0);
};

// ---------- Cargar materia ----------
function cargarMateria(clave){
  S.clave = clave; S.datos = null; S.forzar = false;
  $('plan-caja').innerHTML = '<div class="card"><p class="muted" style="margin:0">Cargando la materia…</p></div>';
  $('lista-alumnos').innerHTML = ''; $('lista-calif').innerHTML = ''; $('lista-temario').innerHTML = '';
  var mm = S.materias.filter(function(x){ return x.clave===clave; })[0];
  $('hdr-materia').textContent = mm ? mm.materia : 'Or Barak';
  $('linea-horario').textContent = '';
  google.script.run.withSuccessHandler(function(d){
    S.datos = d;
    $('linea-horario').innerHTML = d.horario && d.horario.length
      ? (S.sugerida===clave ? '<b class="toca">Le toca ahora</b> · ' : '') + esc(d.horario.join('  ·  '))
      : 'Sin horario fijo capturado';
    pintarProgreso();
    pintarSesiones(); pintarAlumnos(); pintarTemario();
  }).withFailureHandler(function(e){
    $('plan-caja').innerHTML = '<div class="aviso err">'+esc(e.message)+'</div>';
  }).datosMateria(S.token, clave);
}

function pintarProgreso(){
  var d = S.datos, total = d.temario.length, hechas = 0;
  for(var k in d.registradas) hechas++;
  if(!total){ $('prog-caja').classList.add('oculto'); return; }
  if(hechas > total) hechas = total;
  $('prog-caja').classList.remove('oculto');
  $('prog-barra').style.width = Math.round(hechas/total*100)+'%';
  $('prog-texto').textContent = hechas+' de '+total+' sesiones dadas · faltan '+(total-hechas);
}

function pintarSesiones(){
  var d = S.datos, s = $('sel-sesion');
  if(!d.temario.length){
    s.innerHTML = '<option value="">Sin temario capturado</option>';
    pintarPlan(null); return;
  }
  s.innerHTML = '';
  d.temario.forEach(function(t){
    var dada = d.registradas[t.sesion];
    s.innerHTML += '<option value="'+t.sesion+'">Sesión '+t.sesion+' — '+esc(t.tema)+(dada?' (ya registrada)':'')+'</option>';
  });
  s.value = d.siguiente || d.temario[d.temario.length-1].sesion;
  s.onchange = function(){ S.forzar = false; aviso('aviso-clase','',''); pintarPlan(Number(this.value)); pintarBarra(); };
  pintarPlan(Number(s.value));
}

function pintarPlan(n){
  var d = S.datos, caja = $('plan-caja');
  if(!n){
    caja.innerHTML = '<div class="plan sinplan"><div class="t">Esta materia no tiene temario</div>'+
      '<p class="muted" style="margin:6px 0 0">Puedes registrar la clase, pero no habrá contra qué comparar lo que diste. '+
      'Pídele al coordinador que capture el temario.</p></div>';
    $('inp-impartido').value = ''; $('inp-tarea').value = ''; marcarCubrio('Sí');
    return;
  }
  var t = d.temario.filter(function(x){ return x.sesion===n; })[0];
  var dada = d.registradas[n];
  caja.innerHTML =
    '<div class="plan"><div class="n"><b>'+n+'</b><span>sesión</span></div><div style="flex:1">'+
      '<div class="t">'+esc(t.tema)+'</div>'+
      (t.fecha ? '<div class="muted">Planeada para el '+esc(t.fecha)+'</div>' : '')+
      '<dl>'+
        (t.objetivo ? '<dt>Objetivo</dt><dd>'+esc(t.objetivo)+'</dd>' : '')+
        (t.material ? '<dt>Material</dt><dd>'+esc(t.material)+'</dd>' : '')+
        (t.tarea ? '<dt>Tarea planeada</dt><dd>'+esc(t.tarea)+'</dd>' : '')+
      '</dl>'+
    '</div></div>' +
    (dada ? '<div class="aviso info">Esta sesión ya se registró el '+esc(dada)+'. Si la vuelves a registrar quedarán dos renglones.</div>' : '');
  $('inp-impartido').value = t.tema;
  $('inp-tarea').value = t.tarea;
  marcarCubrio('Sí');
}

function marcarCubrio(v){
  S.cubrio = v;
  Array.prototype.forEach.call($('seg-cubrio').children, function(b){ b.classList.toggle('on', b.dataset.v===v); });
}
Array.prototype.forEach.call($('seg-cubrio').children, function(b){
  b.onclick = function(){ marcarCubrio(b.dataset.v); if(b.dataset.v!=='Sí') $('inp-impartido').focus(); };
});
marcarCubrio('Sí');

function pintarAlumnos(){
  var d = S.datos, cont = $('lista-alumnos'), cal = $('lista-calif');
  S.asis = {};
  if(!d.alumnos.length){
    var v = '<p class="vacio">No hay alumnos inscritos en esta materia.<br>El coordinador los da de alta en la hoja Inscripciones.</p>';
    cont.innerHTML = v; cal.innerHTML = v; contarAsis(); return;
  }
  cont.innerHTML = ''; cal.innerHTML = '';
  d.alumnos.forEach(function(a){
    S.asis[a.id] = 'Asistió';
    var estados = ['Asistió','Retardo','Falta','Falta justificada'];
    var cortos = ['Asistió','Retardo','Falta','Justif.'];
    var html = '<div class="alumno"><div class="nm">'+esc(a.nombre)+'</div><div class="mini">';
    estados.forEach(function(e,i){
      html += '<button data-id="'+esc(a.id)+'" data-v="'+esc(e)+'"'+(i===0?' class="on"':'')+'>'+cortos[i]+'</button>';
    });
    cont.innerHTML += html + '</div></div>';
    cal.innerHTML += '<div class="alumno" style="display:flex; align-items:center; justify-content:space-between; gap:12px">'+
      '<div class="nm" style="margin:0">'+esc(a.nombre)+'</div>'+
      '<input class="calif" type="tel" inputmode="decimal" data-id="'+esc(a.id)+'" placeholder="—"></div>';
  });
  Array.prototype.forEach.call(cont.querySelectorAll('button'), function(b){
    b.onclick = function(){
      S.asis[b.dataset.id] = b.dataset.v;
      Array.prototype.forEach.call(b.parentElement.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      contarAsis();
    };
  });
  contarAsis();
}

function contarAsis(){
  var total = 0, pres = 0, faltan = [];
  for(var id in S.asis){ total++; if(S.asis[id]==='Asistió') pres++; }
  $('cont-asis').textContent = total ? pres+' de '+total+' presentes' : '—';
  pintarBarra();
}

function pintarBarra(){
  if(S.tab === 'calif'){ $('barra-resumen').textContent = 'Escala 0 a 10'; $('barra-extra').textContent = ''; return; }
  var total = 0, pres = 0;
  for(var id in S.asis){ total++; if(S.asis[id]==='Asistió') pres++; }
  var s = $('sel-sesion').value;
  $('barra-resumen').textContent = s ? 'Sesión ' + s : 'Sin temario';
  $('barra-extra').textContent = total ? pres + ' de ' + total + ' presentes' : '';
}

function pintarTemario(){
  var d = S.datos, c = $('lista-temario');
  if(!d.temario.length){ c.innerHTML = '<p class="vacio">Esta materia todavía no tiene temario capturado.</p>'; return; }
  var html = '<ul class="lista-t">';
  d.temario.forEach(function(t){
    var dada = d.registradas[t.sesion];
    html += '<li><span class="est '+(dada?'dada':'pend')+'">'+(dada?'Dada':'Sesión '+t.sesion)+'</span>'+
      '<div><div class="tt">'+esc(t.tema)+'</div>'+
      '<div class="muted">'+(dada ? 'Registrada el '+esc(dada) : (t.fecha ? 'Planeada para el '+esc(t.fecha) : 'Sin fecha planeada'))+'</div></div></li>';
  });
  c.innerHTML = html + '</ul>';
}

// ---------- Guardar ----------
$('btn-guardar').onclick = function(){
  if(S.enviando || !S.datos) return;
  if(S.tab === 'calif') return guardarCalif();
  guardarSesion(S.forzar);
};

function bloquea(txt){ S.enviando = true; $('btn-guardar').disabled = true; $('btn-guardar').textContent = txt; }
function libera(txt){ S.enviando = false; $('btn-guardar').disabled = false; $('btn-guardar').textContent = txt; }

function guardarSesion(forzar){
  var impartido = $('inp-impartido').value.trim();
  if(!impartido){ aviso('aviso-clase','err','Escribe qué tema diste hoy.'); return; }
  var lista = [];
  for(var id in S.asis){ lista.push({ id:id, estado:S.asis[id], obs:'' }); }
  bloquea('Registrando…');
  google.script.run.withSuccessHandler(function(r){
    if(r.duplicado){
      libera('Registrar sesión');
      S.forzar = true;
      aviso('aviso-clase','info', r.mensaje + ' Toca otra vez para registrarla de todos modos.');
      return;
    }
    libera('Registrar sesión');
    S.forzar = false;
    aviso('aviso-clase','','');
    $('inp-obs').value = '';
    $('exito-msg').textContent = r.mensaje;
    $('tab-clase').classList.add('oculto');
    $('card-materia').classList.add('oculto');
    document.querySelector('.barra').classList.add('oculto');
    $('exito').classList.remove('oculto');
    window.scrollTo(0,0);
  }).withFailureHandler(function(e){
    libera('Registrar sesión'); aviso('aviso-clase','err', e.message);
  }).registrarSesion({
    token:S.token, clave:S.clave, sesion:$('sel-sesion').value || 0, fecha:new Date().toISOString(),
    impartido:impartido, cubrio:S.cubrio, tarea:$('inp-tarea').value.trim(),
    obs:$('inp-obs').value.trim(), asistencia:lista, forzar:forzar
  });
}

function guardarCalif(){
  var lista = [];
  Array.prototype.forEach.call($('lista-calif').querySelectorAll('input'), function(i){
    var v = i.value.trim();
    if(v !== '') lista.push({ id:i.dataset.id, calif:v.replace(',', '.'), obs:'' });
  });
  if(!lista.length){ aviso('aviso-calif','err','No capturaste ninguna calificación.'); return; }
  var mala = lista.filter(function(x){ var n=Number(x.calif); return isNaN(n) || n<0 || n>10; });
  if(mala.length){ aviso('aviso-calif','err','Hay calificaciones fuera del 0 al 10.'); return; }
  bloquea('Guardando…');
  google.script.run.withSuccessHandler(function(r){
    libera('Guardar calificaciones');
    aviso('aviso-calif', r.ok?'ok':'err', r.mensaje);
    if(r.ok) Array.prototype.forEach.call($('lista-calif').querySelectorAll('input'), function(i){ i.value=''; });
  }).withFailureHandler(function(e){
    libera('Guardar calificaciones'); aviso('aviso-calif','err', e.message);
  }).registrarCalificaciones({ token:S.token, clave:S.clave, tipo:$('sel-tipo').value,
                               fecha:new Date().toISOString(), calificaciones:lista });
}
</script>
